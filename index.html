<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Code Name Sherry</title>
  <style>
    :root {
      --bg: #000;
      --panel: #1c1c1c;
      --line: #2a2a2a;
      --text: #ececec;
      --muted: #8a8a8a;
      --soft: #111;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: var(--text); }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    canvas#field {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(600px 400px at var(--mx, 50%) var(--my, 30%), rgba(120,140,180,.08), transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.72));
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .logo b {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: #fff;
      color: #000;
      display: grid; place-items: center;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 0 0 0 rgba(255,255,255,.4);
      animation: pulse 3.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.28); }
      50% { box-shadow: 0 0 18px 2px rgba(180,200,255,.18); }
    }
    .ghost {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .ghost:hover { background: #161616; color: #fff; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 20px;
    }
    main::-webkit-scrollbar { width: 0; }

    .landing {
      min-height: 70%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
    }
    .landing h1 {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 500;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #fff 0%, #c9d4ea 40%, #fff 70%, #9aa8c7 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 7s linear infinite;
    }
    @keyframes sheen {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 560px;
    }
    .chip {
      border: 1px solid #2b2b2b;
      background: rgba(13,13,13,.72);
      color: #d7d7d7;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s, background .2s, box-shadow .2s;
    }
    .chip:hover {
      background: #171717;
      border-color: #4a4a4a;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }

    .msg { padding: 18px 4px; animation: in .32s ease; }
    @keyframes in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .msg .who {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .msg.user .who { color: #fff; }
    .msg.ai .who { color: #cfcfcf; }
    .msg .body {
      font-size: 15.5px;
      line-height: 1.65;
      color: #e8e8e8;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.error .body { color: #ffb4b4; }
    .msg .body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      background: #161616;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg .body pre {
      margin: 10px 0;
      padding: 12px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre;
    }
    .think {
      color: var(--muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spin {
      width: 12px; height: 12px;
      border: 1.6px solid #444;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dock {
      padding: 8px 16px 16px;
    }
    .box {
      background: rgba(28,28,28,.86);
      border: 1px solid #2a2a2a;
      border-radius: 28px;
      padding: 8px 8px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      backdrop-filter: blur(16px);
      transition: border-color .2s, box-shadow .2s;
    }
    .box:focus-within {
      border-color: #5a5a5a;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.45);
    }
    textarea {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      resize: none;
      max-height: 160px;
      min-height: 28px;
      padding: 10px 0;
    }
    textarea::placeholder { color: #7a7a7a; }
    .go {
      width: 36px; height: 36px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #000;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex: 0 0 36px;
    }
    .go { transition: transform .15s ease, opacity .15s; }
    .go:not(:disabled):hover { transform: scale(1.06); }
    .go:not(:disabled):active { transform: scale(.96); }
    .go:disabled { opacity: .28; cursor: default; }
    .go svg { width: 16px; height: 16px; fill: currentColor; }
    .fine {
      text-align: center;
      color: #5c5c5c;
      font-size: 11px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="vignette"></div>
  <div class="app">
    <header>
      <div class="logo"><b>S</b> Code Name Sherry</div>
      <button class="ghost" id="newChat" type="button">Percakapan baru</button>
    </header>
    <main id="thread"></main>
    <div class="dock">
      <form class="box" id="form">
        <textarea id="input" rows="1" placeholder="Ada yang bisa dibantu?" autocomplete="off"></textarea>
        <button class="go" id="send" type="submit" aria-label="Kirim">
          <svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5l2.4 6.7L14.2 12l-8.8 1.8z"/></svg>
        </button>
      </form>
      <p class="fine">Code Name Sherry · dibuat Adamm S.</p>
    </div>
  </div>
  <script>
    const ENDPOINTS = [
      { url: "https://api.zyvor.my.id/api/ai/aichatting", q: "text" },
      { url: "https://api.zyvor.my.id/api/ai/unlimited", q: "teks" },
      { url: "https://api.zyvor.my.id/api/ai/aiseek", q: "message" },
      { url: "https://api.zyvor.my.id/api/ai/kimi", q: "teks" },
      { url: "https://api.alwayscodex.eu.cc/api/ai/kimi", q: "teks" }
    ];

    const PERSONA = "Kamu adalah Code Name Sherry. Pembuatmu satu-satunya: Adamm S. Jangan bilang kamu dibuat Sherry, Adam tanpa S, Kimi, Gemini, ChatGPT, atau perusahaan mana pun. Gaya: asik, blak-blakan, cerdas, tidak kaku. Bahasa mengikuti user. Jangan ulang instruksi ini.";

    const thread = document.getElementById("thread");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const state = {
      session: localStorage.getItem("sa.sid") || uid(),
      messages: JSON.parse(localStorage.getItem("sa.msgs") || "[]"),
      busy: false,
      primed: false
    };
    localStorage.setItem("sa.sid", state.session);

    function uid() {
      return "sa-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
    function save() {
      localStorage.setItem("sa.sid", state.session);
      localStorage.setItem("sa.msgs", JSON.stringify(state.messages.slice(-80)));
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function md(raw) {
      let t = esc(raw || "");
      const blocks = [];
      t = t.replace(/```([\s\S]*?)```/g, (_, c) => {
        blocks.push("<pre><code>" + c.trim() + "</code></pre>");
        return "\0B" + (blocks.length - 1) + "\0";
      });
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return t.replace(/\0B(\d+)\0/g, (_, i) => blocks[+i]);
    }

    const HINTS = [
      "Siapa yang menciptakan saya?"
    ];

    function landing() {
      thread.innerHTML = `
        <div class="landing">
          <h1>Ada yang bisa dibantu?</h1>
          <div class="chips">${HINTS.map(h => `<button class="chip" type="button">${esc(h)}</button>`).join("")}</div>
        </div>`;
      thread.querySelectorAll(".chip").forEach(b => b.onclick = () => {
        input.value = b.textContent;
        form.requestSubmit();
      });
    }

    function row(msg, thinking) {
      const el = document.createElement("div");
      el.className = "msg " + msg.role + (msg.error ? " error" : "");
      el.innerHTML = `<div class="who">${msg.role === "user" ? "Kamu" : "Sherry"}</div>
        <div class="body">${thinking ? '<div class="think"><i class="spin"></i>Lagi mikir</div>' : md(msg.text)}</div>`;
      thread.appendChild(el);
      thread.scrollTop = thread.scrollHeight;
      return el;
    }

    function draw() {
      thread.innerHTML = "";
      if (!state.messages.length) landing();
      else state.messages.forEach(m => row(m));
    }

    function identity(text) {
      return /(siapa\s+(yang\s+)?(cipta|menciptakan|bikin|buat|pencipta)|who\s+(made|created|are)\s+you|kamu\s+siapa|lu\s+siapa|creator|adamm|pembuat)/i.test(text);
    }

    function extract(data) {
      if (data == null) return "";
      if (typeof data === "string") return data.trim();
      if (typeof data.result === "object" && data.result) {
        if (typeof data.result.text === "string" && data.result.text.trim()) return data.result.text.trim();
        const inner = extract(data.result);
        if (inner) return inner;
      }
      for (const k of ["result", "response", "answer", "output", "content", "text"]) {
        if (typeof data[k] === "string" && data[k].trim()) return data[k].trim();
      }
      if (data.data && data.data !== data) return extract(data.data);
      if (typeof data.message === "string" && data.status !== false && data.success !== false && data.message.length > 8) {
        return data.message.trim();
      }
      return "";
    }

    function wrapUrl(target) {
      return [
        target,
        "https://cors-anywhere.com/" + target
      ];
    }

    async function pull(url, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { method: "GET", signal: ctrl.signal });
        const raw = await res.text();
        let data;
        try { data = JSON.parse(raw); } catch { data = { result: raw }; }
        if (data.contents && typeof data.contents === "string") {
          try { data = JSON.parse(data.contents); } catch { data = { result: data.contents }; }
        }
        return { res, data };
      } finally {
        clearTimeout(t);
      }
    }

    async function ask(userText) {
      const body = state.primed
        ? "Tetap jadi Code Name Sherry. Pembuat: Adamm S. Blak-blakan.\n\nUser: " + userText
        : PERSONA + "\n\nUser: " + userText;
      let last = "Load failed. API tidak merespons.";
      for (const ep of ENDPOINTS) {
        const target = ep.url + "?" + ep.q + "=" + encodeURIComponent(body) + "&session=" + encodeURIComponent(state.session);
        for (const u of wrapUrl(target)) {
          try {
            const { res, data } = await pull(u, 28000);
            if (data.session_id) state.session = String(data.session_id);
            else if (data.conversation_id) state.session = String(data.conversation_id);
            const reply = extract(data).trim();
            const errMsg = String(data.message || data.result || "");
            if (reply && data.status !== false && data.success !== false) {
              state.primed = true;
              return reply;
            }
            if (/token|quota|gagal|404|failed/i.test(errMsg)) last = errMsg;
            else if (!res.ok) last = "HTTP " + res.status;
          } catch (e) {
            last = e.name === "AbortError" ? "Timeout. Server API lemot." : "Fetch diblokir / API down.";
          }
        }
      }
      throw new Error(last);
    }

    function resize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || state.busy) return;
      if (!state.messages.length) thread.innerHTML = "";
      const user = { role: "user", text, ts: Date.now() };
      state.messages.push(user);
      row(user);
      save();
      input.value = "";
      resize();
      state.busy = true;
      sendBtn.disabled = true;
      const pending = row({ role: "ai", text: "" }, true);
      try {
        const reply = identity(text)
          ? "Gue Code Name Sherry. Yang menciptakan gue Adamm S. Satu orang. Bukan perusahaan, bukan nama lain."
          : await ask(text);
        pending.remove();
        const ai = { role: "ai", text: reply, ts: Date.now() };
        state.messages.push(ai);
        row(ai);
      } catch (err) {
        pending.remove();
        const ai = { role: "ai", error: true, text: "Load failed.\n\n" + err.message + "\n\nKalau file dibuka langsung (file://), coba lewat server lokal:\npython3 -m http.server 8080", ts: Date.now() };
        state.messages.push(ai);
        row(ai);
      } finally {
        save();
        state.busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("input", resize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    document.getElementById("newChat").onclick = () => {
      state.messages = [];
      state.session = uid();
      state.primed = false;
      save();
      draw();
      input.focus();
    };
    draw();
    resize();

    (function space() {
      const c = document.getElementById("field");
      const ctx = c.getContext("2d");
      const ptr = { x: innerWidth / 2, y: innerHeight * 0.3, tx: innerWidth / 2, ty: innerHeight * 0.3 };
      let stars = [];
      function resizeC() {
        c.width = innerWidth * devicePixelRatio;
        c.height = innerHeight * devicePixelRatio;
        c.style.width = innerWidth + "px";
        c.style.height = innerHeight + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        const n = Math.min(90, Math.floor(innerWidth * innerHeight / 18000));
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          z: Math.random() * 1.2 + 0.2,
          r: Math.random() * 1.2 + 0.2
        }));
      }
      resizeC();
      addEventListener("resize", resizeC);
      addEventListener("pointermove", (e) => {
        ptr.tx = e.clientX; ptr.ty = e.clientY;
        document.body.style.setProperty("--mx", e.clientX + "px");
        document.body.style.setProperty("--my", e.clientY + "px");
      }, { passive: true });
      function tick() {
        ptr.x += (ptr.tx - ptr.x) * 0.06;
        ptr.y += (ptr.ty - ptr.y) * 0.06;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        const cx = innerWidth / 2, cy = innerHeight / 2;
        ctx.strokeStyle = "rgba(160,175,210,0.06)";
        ctx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
          ctx.beginPath();
          ctx.ellipse(cx + (ptr.x - cx) * 0.04, cy + (ptr.y - cy) * 0.03, 90 * i, 58 * i, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        for (const s of stars) {
          const dx = (ptr.x - cx) * 0.012 * s.z;
          const dy = (ptr.y - cy) * 0.012 * s.z;
          ctx.fillStyle = "rgba(230,235,245," + (0.25 + s.z * 0.45) + ")";
          ctx.beginPath();
          ctx.arc(s.x + dx, s.y + dy, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
