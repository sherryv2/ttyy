<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080b" />
  <title>Aether</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080b;
      --bg-2: #0c0e14;
      --line: rgba(214, 196, 160, 0.12);
      --line-strong: rgba(214, 196, 160, 0.22);
      --gold: #d6c4a0;
      --gold-dim: #9a8b6e;
      --text: #ece8df;
      --muted: #8d887c;
      --user: #16141a;
      --ai: transparent;
      --danger: #c9897a;
      --ok: #8fad8a;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }

    .sky {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(214, 196, 160, 0.07), transparent 55%),
        radial-gradient(800px 500px at 110% 90%, rgba(90, 110, 150, 0.08), transparent 50%),
        radial-gradient(600px 400px at -10% 80%, rgba(214, 196, 160, 0.04), transparent 45%),
        var(--bg);
    }
    .sky::before {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(214,196,160,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(214,196,160,0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
    }
    .orbit {
      position: absolute; left: 50%; top: 42%;
      width: 520px; height: 520px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(214,196,160,0.08);
      border-radius: 50%;
    }
    .orbit.s2 { width: 340px; height: 340px; border-color: rgba(214,196,160,0.06); }
    .orbit.s3 { width: 180px; height: 180px; border-color: rgba(214,196,160,0.05); }
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 22%, rgba(236,232,223,.7), transparent),
        radial-gradient(1px 1px at 78% 18%, rgba(236,232,223,.45), transparent),
        radial-gradient(1.4px 1.4px at 64% 72%, rgba(214,196,160,.55), transparent),
        radial-gradient(1px 1px at 28% 68%, rgba(236,232,223,.35), transparent),
        radial-gradient(1px 1px at 88% 54%, rgba(236,232,223,.4), transparent),
        radial-gradient(1.2px 1.2px at 46% 14%, rgba(214,196,160,.5), transparent);
    }

    .app {
      position: relative; z-index: 1;
      height: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      background: linear-gradient(180deg, rgba(7,8,11,.72), rgba(7,8,11,.28));
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--line-strong);
      display: grid; place-items: center;
      position: relative;
    }
    .mark span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(214,196,160,.55);
    }
    .mark::after {
      content: "";
      position: absolute; inset: 5px;
      border: 1px solid rgba(214,196,160,.25);
      border-radius: 50%;
      border-top-color: transparent;
    }
    .titles { min-width: 0; }
    .titles h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 22px; font-weight: 400; letter-spacing: 0.04em;
      line-height: 1.1;
    }
    .titles p {
      color: var(--muted); font-size: 11px; letter-spacing: 0.16em;
      text-transform: uppercase; margin-top: 3px;
    }
    .actions { display: flex; gap: 8px; }
    .icon-btn {
      appearance: none; border: 1px solid var(--line);
      background: rgba(12,14,20,.5); color: var(--gold);
      width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; display: grid; place-items: center;
      transition: border-color .2s, background .2s;
    }
    .icon-btn:hover { border-color: var(--line-strong); background: rgba(214,196,160,.06); }
    .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }

    main {
      flex: 1; overflow-y: auto; padding: 28px 20px 12px;
      scroll-behavior: smooth;
    }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: rgba(214,196,160,.18); border-radius: 8px; }

    .hero {
      text-align: center; padding: 48px 8px 28px;
    }
    .hero h2 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400; font-size: clamp(28px, 6vw, 42px);
      letter-spacing: -0.02em; line-height: 1.15;
    }
    .hero h2 em { font-style: italic; color: var(--gold); }
    .hero p {
      color: var(--muted); margin-top: 12px; font-size: 14px; line-height: 1.6;
    }
    .hints {
      display: grid; gap: 8px; margin-top: 28px;
    }
    .hint {
      text-align: left; width: 100%;
      border: 1px solid var(--line); background: rgba(12,14,20,.45);
      color: var(--text); border-radius: 14px; padding: 12px 14px;
      cursor: pointer; font: inherit; font-size: 13.5px;
      transition: border-color .2s, background .2s;
    }
    .hint:hover { border-color: var(--line-strong); background: rgba(214,196,160,.05); }
    .hint small { display: block; color: var(--muted); margin-top: 3px; font-size: 11.5px; }

    .row {
      display: flex; gap: 12px; margin: 0 0 22px;
      animation: rise .35s ease;
    }
    .row.user { flex-direction: row-reverse; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .avatar {
      flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid var(--line-strong);
      display: grid; place-items: center;
      font-size: 10px; letter-spacing: .08em; color: var(--gold);
      margin-top: 2px;
    }
    .row.user .avatar { color: var(--text); background: #1a1820; }
    .bubble {
      max-width: min(100%, 620px);
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.65; font-size: 14.5px;
      white-space: pre-wrap; word-break: break-word;
    }
    .row.ai .bubble {
      background: rgba(16,18,24,.55);
      border: 1px solid var(--line);
    }
    .row.user .bubble {
      background: #14131a;
      border: 1px solid rgba(214,196,160,.16);
    }
    .bubble.error { border-color: rgba(201,137,122,.35); color: #ead7d2; }
    .bubble a { color: var(--gold); }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px; background: rgba(255,255,255,.05);
      padding: 1px 5px; border-radius: 4px;
    }
    .bubble pre {
      margin: 10px 0; padding: 12px;
      background: #090a0e; border: 1px solid var(--line);
      border-radius: 10px; overflow-x: auto; white-space: pre;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble strong { font-weight: 600; color: #f3efe6; }
    .meta {
      display: flex; gap: 10px; align-items: center;
      margin-top: 6px; color: var(--muted); font-size: 11px;
    }
    .copy {
      background: none; border: 0; color: var(--gold-dim);
      cursor: pointer; font: inherit; font-size: 11px; letter-spacing: .04em;
    }
    .copy:hover { color: var(--gold); }

    .thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .dots { display: flex; gap: 5px; }
    .dots i {
      width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
      opacity: .25; animation: pulse 1.1s infinite ease-in-out;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

    .composer-wrap {
      padding: 8px 16px 16px;
    }
    .composer {
      display: flex; align-items: flex-end; gap: 8px;
      border: 1px solid var(--line);
      background: rgba(12,14,20,.72);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 8px 8px 8px 16px;
      box-shadow: var(--shadow);
    }
    .composer:focus-within { border-color: var(--line-strong); }
    textarea {
      flex: 1; resize: none; border: 0; outline: none;
      background: transparent; color: var(--text);
      font: inherit; font-size: 15px; line-height: 1.45;
      max-height: 160px; min-height: 24px; padding: 8px 0;
    }
    textarea::placeholder { color: #6f6b62; }
    .send {
      appearance: none; border: 0; cursor: pointer;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--gold); color: #1a160f;
      display: grid; place-items: center; flex: 0 0 40px;
      transition: opacity .2s, transform .15s;
    }
    .send:disabled { opacity: .35; cursor: default; }
    .send:not(:disabled):hover { transform: translateY(-1px); }
    .send svg { width: 16px; height: 16px; fill: currentColor; }
    .footnote {
      text-align: center; color: #5e5a52; font-size: 11px;
      margin-top: 8px; letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="orbit"></div>
    <div class="orbit s2"></div>
    <div class="orbit s3"></div>
  </div>

  <div class="app">
    <header>
      <div class="brand">
        <div class="mark"><span></span></div>
        <div class="titles">
          <h1>Aether</h1>
          <p>Spacetime interface</p>
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" id="newChat" title="Percakapan baru" aria-label="Percakapan baru">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="thread"></main>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="Tanyakan apa saja…" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="Kirim">
          <svg viewBox="0 0 24 24"><path d="M3.2 21 22 12 3.2 3l2.2 7.6L16 12l-10.6 1.4z"/></svg>
        </button>
      </form>
      <p class="footnote">Kimi 2.5 Thinking · sesi tersimpan di perangkat ini</p>
    </div>
  </div>

  <script>
    const API_HOSTS = [
      "https://api.alwayscodex.eu.cc/api/ai/kimi",
      "https://api.zyvor.my.id/api/ai/kimi"
    ];

    const thread = document.getElementById("thread");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("newChat");

    const state = {
      session: localStorage.getItem("aether.session") || createSession(),
      messages: JSON.parse(localStorage.getItem("aether.messages") || "[]"),
      busy: false
    };

    function createSession() {
      const id = "aether-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      localStorage.setItem("aether.session", id);
      return id;
    }

    function persist() {
      localStorage.setItem("aether.messages", JSON.stringify(state.messages.slice(-80)));
      localStorage.setItem("aether.session", state.session);
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderMarkdown(raw) {
      let text = escapeHtml(raw || "");
      const blocks = [];
      text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
        const i = blocks.push(`<pre><code>${code.trim()}</code></pre>`) - 1;
        return `\u0000B${i}\u0000`;
      });
      text = text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      text = text.replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[+i]);
      return text;
    }

    function timeLabel(ts) {
      try {
        return new Date(ts).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      } catch { return ""; }
    }

    const HINTS = [
      { t: "Jelaskan relativitas dengan analogi sehari-hari", s: "Tanpa rumus yang berlebihan." },
      { t: "Susun rencana 7 hari untuk fokus belajar", s: "Ringkas, realistis, bisa dijalankan." },
      { t: "Tulis ulang teks ini agar lebih tenang dan jelas", s: "Sisipkan teks Anda setelah mengirim." }
    ];

    function emptyState() {
      thread.innerHTML = `
        <section class="hero">
          <h2>Berbicara di tepi <em>waktu</em>.</h2>
          <p>Antarmuka tenang untuk bertanya, menulis, dan menata pikiran.</p>
          <div class="hints">
            ${HINTS.map(h => `<button class="hint" data-q="${escapeHtml(h.t)}">${escapeHtml(h.t)}<small>${escapeHtml(h.s)}</small></button>`).join("")}
          </div>
        </section>`;
      thread.querySelectorAll(".hint").forEach(btn => {
        btn.addEventListener("click", () => {
          input.value = btn.dataset.q;
          input.focus();
          resize();
          form.requestSubmit();
        });
      });
    }

    function addRow(msg, opts = {}) {
      const row = document.createElement("div");
      row.className = "row " + msg.role;
      const isUser = msg.role === "user";
      row.innerHTML = `
        <div class="avatar">${isUser ? "ANDA".slice(0,1) : "Ae"}</div>
        <div>
          <div class="bubble ${msg.error ? "error" : ""}">${
            opts.thinking
              ? `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>Menyusun jawaban</div>`
              : renderMarkdown(msg.text)
          }</div>
          ${opts.thinking ? "" : `<div class="meta"><span>${timeLabel(msg.ts)}</span>${isUser || msg.error ? "" : `<button class="copy" type="button">Salin</button>`}</div>`}
        </div>`;
      const copy = row.querySelector(".copy");
      if (copy) copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(msg.text); copy.textContent = "Tersalin"; setTimeout(() => copy.textContent = "Salin", 1200); } catch {}
      });
      thread.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return row;
    }

    function draw() {
      thread.innerHTML = "";
      if (!state.messages.length) { emptyState(); return; }
      state.messages.forEach(m => addRow(m));
      thread.scrollTop = thread.scrollHeight;
    }

    function extractReply(data) {
      if (data == null) return "";
      if (typeof data === "string") return data;
      if (typeof data.result === "string" && data.result.trim()) return data.result;
      if (typeof data.response === "string" && data.response.trim()) return data.response;
      if (typeof data.answer === "string" && data.answer.trim()) return data.answer;
      if (data.data && data.data !== data) return extractReply(data.data);
      if (typeof data.message === "string" && data.message.trim() && data.status !== false && data.success !== false) {
        return data.message;
      }
      return "";
    }

    function looksFailed(data, httpOk) {
      if (!httpOk) return true;
      if (!data || typeof data !== "object") return false;
      if (data.status === false || data.success === false) return true;
      const msg = String(data.message || data.result || "");
      return /used all your free tokens|quota|gagal/i.test(msg) && !extractReply(data);
    }

    async function callKimi(teks) {
      let lastErr = null;
      for (const base of API_HOSTS) {
        const url = base + "?teks=" + encodeURIComponent(teks) + "&session=" + encodeURIComponent(state.session);
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 90000);
        try {
          const res = await fetch(url, { method: "GET", signal: ctrl.signal });
          const raw = await res.text();
          let data;
          try { data = JSON.parse(raw); } catch { data = { result: raw }; }
          const reply = extractReply(data);
          if (data && data.session_id) {
            state.session = String(data.session_id);
          } else if (data && data.conversation_id) {
            state.session = String(data.conversation_id);
          }
          if (reply && !looksFailed(data, res.ok)) return reply;
          lastErr = new Error(data && (data.message || data.result) ? String(data.message || data.result) : ("HTTP " + res.status));
          if (res.ok && reply) return reply;
        } catch (err) {
          lastErr = err.name === "AbortError" ? new Error("Waktu tunggu habis. Coba lagi.") : err;
        } finally {
          clearTimeout(timer);
        }
      }
      throw lastErr || new Error("Tidak bisa menghubungi API.");
    }

    function resize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    async function onSubmit(e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || state.busy) return;

      if (!state.messages.length) thread.innerHTML = "";

      const userMsg = { role: "user", text, ts: Date.now() };
      state.messages.push(userMsg);
      addRow(userMsg);
      persist();

      input.value = "";
      resize();
      state.busy = true;
      sendBtn.disabled = true;

      const pending = addRow({ role: "ai", text: "", ts: Date.now() }, { thinking: true });

      try {
        const reply = await callKimi(text);
        pending.remove();
        const aiMsg = { role: "ai", text: reply, ts: Date.now() };
        state.messages.push(aiMsg);
        addRow(aiMsg);
      } catch (err) {
        pending.remove();
        const aiMsg = {
          role: "ai",
          error: true,
          text: "Tidak dapat menyelesaikan permintaan.\n\n" + (err && err.message ? err.message : "Kesalahan jaringan."),
          ts: Date.now()
        };
        state.messages.push(aiMsg);
        addRow(aiMsg);
      } finally {
        persist();
        state.busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", onSubmit);
    input.addEventListener("input", resize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    newChatBtn.addEventListener("click", () => {
      state.messages = [];
      state.session = createSession();
      persist();
      draw();
      input.focus();
    });

    draw();
    resize();
  </script>
</body>
</html>
